name: Deploy

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Build production project
              run: npm run build:prod
            - name: Connect to server and deploy
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e

                      echo "🔧 Load NVM and Node environment..."
                      export NVM_DIR="/root/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                      export PATH="$NVM_DIR/versions/node/v20.19.5/bin:$PATH"

                      echo "✅ Pulling latest code..."
                      cd /var/www/project

                      if [ ! -d "frontend/.git" ]; then
                        echo "📦 Cloning repository..."
                        git clone git@github.com:Myrhoiazov/admin-panel.git frontend
                      fi

                      cd frontend
                      git config --global --add safe.directory /var/www/project/frontend
                      git fetch --all
                      git pull origin main

                      echo "📦 Installing dependencies..."
                      npm install

                      echo "🧹 Cleaning old build artifacts..."
                      rm -rf build/

                      echo "⚙️ Building project..."
                      npm run build:prod || echo "no build step"

                      echo "♻️ Restarting PM2..."
                      pm2 restart frontend

                      echo "✅ Deployment complete :- ) !"
