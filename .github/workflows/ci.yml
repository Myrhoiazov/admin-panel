name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches-ignore:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci

            - name: Lint TypeScript
              run: npm run lint:ts

            - name: Lint SCSS
              run: npm run lint:scss

            # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF bypass) is allowlisted: this app
            # only uses classic client-side <BrowserRouter>, never React Router's RSC/data-router
            # mode, so the advisory doesn't apply. Fixing it requires an unrelated v7->v8 major
            # bump. Revisit the allowlist entry if that migration happens.
            - name: Audit production dependencies
              run: npm run audit:ci

            # - name: Run unit tests
            #   run: npm run test:unit

            # - name: Build Storybook
            #   run: npm run storybook:build

            # - name: Run screenshot tests
            #   run: npm run test:ui:ci

    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
                  sudo mv gitleaks /usr/local/bin/

            - name: Scan for secrets
              run: gitleaks detect --source . --redact --verbose
